<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #wrap {
            padding: 0;
            margin: 0 auto;
            width: 450px;
        }
    </style>
</head>
<body>
    <div id="wrap">
        <svg id="canvas" width="450px" height="230px">
            <defs>
                <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0">
                    <stop offset="0" stop-color="red" />
                    <stop offset=".5" stop-color="yellow" />
                    <stop offset="1" stop-color="blue" />
                </linearGradient>
                <linearGradient id="g2" x1="1" y1="0" x2="0" y2="0">
                    <stop offset="0" stop-color="red" />
                    <stop offset=".5" stop-color="yellow" />
                    <stop offset="1" stop-color="blue" />
                </linearGradient>
                <linearGradient id="g3" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0" stop-color="red" />
                    <stop offset=".5" stop-color="yellow" />
                    <stop offset="1" stop-color="blue" />
                </linearGradient>
                <linearGradient id="g4" x1="1" y1="0" x2="0" y2="1">
                    <stop offset="0" stop-color="red" />
                    <stop offset=".5" stop-color="yellow" />
                    <stop offset="1" stop-color="blue" />
                </linearGradient>
            </defs>
            <rect x="0" y="0" width="450" height="230" fill="lightgray" />
            <rect x="10" y="10" width="100" height="100" fill="url(#g1)" />
            <rect x="120" y="10" width="100" height="100" fill="url(#g2)" />
            <rect x="230" y="10" width="100" height="100" fill="url(#g3)" />
            <rect x="340" y="10" width="100" height="100" fill="url(#g4)" />
            Browser does not support canvas
        </svg>
    </div>
</body>
</html>
