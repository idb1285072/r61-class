<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #wrap {
            padding: 0;
            margin: 0 auto;
            width: 450px;
        }
    </style>
</head>
<body>
    <div id="wrap">
        <svg id="canvas" width="450px" height="230px">
            <rect x="0" y="0" width="450" height="230" fill="lightgray" />
            <line x1="10" y1="10" x2="110" y2="10" stroke="red" stroke-width="5" />
            <line x1="120" y1="10" x2="220" y2="10" stroke="red" stroke-width="5" />
            <line x1="230" y1="10" x2="330" y2="10" stroke="red" stroke-width="5" />
            <line x1="340" y1="10" x2="440" y2="10" stroke="red" stroke-width="5" />
            <line x1="10" y1="10" x2="440" y2="220" stroke="blue" stroke-width="5" />
            <line x1="440" y1="10" x2="10" y2="220" stroke="blue" stroke-width="5" />
            <line x1="10" y1="220" x2="440" y2="220" stroke="green" stroke-width="5" />
            Browser does not support canvas
        </svg>
    </div>
</body>
</html>
