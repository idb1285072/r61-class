<div class="p-1">
    <table class="table table-sm table-bordered text-dark">
    <tr><th></th><th>Name</th> </tr>
    <tr *ngFor="let item of students; let i = index;
    let c = count; let odd = odd"
     class="text-white" [class.bg-primary]="odd"
    [class.bg-info]="!odd">
    <td (mouseover)="selectedItem=item">{{ i + 1 }} of {{ c }}</td>
    <td>{{item |titlecase}}</td>
   
    </tr>
    </table>
    <div>
        selected Item : {{selectedItem}}
    </div>
    <div>
        {{Amount|currency}}
    </div>
    <div>
        {{Amount|number: '4.2-5' }}
    </div>
    <p>
        With digitsInfo parameter specified:
        {{ pi | number: '4.1-5' }}
        <!--output: '0,003.14159'-->
      </p>
  
    </div>
