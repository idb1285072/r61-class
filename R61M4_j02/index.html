<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <a class="navbar-brand" href="#">Navbar</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
      
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav mr-auto">
            <li class="nav-item active">
              <a class="nav-link" href="#">Home <span class="sr-only">(current)</span></a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Link</a>
            </li>
            <li class="nav-item dropdown">
              <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                Dropdown
              </a>
              <div class="dropdown-menu" aria-labelledby="navbarDropdown">
                <a class="dropdown-item" href="#">Action</a>

              </div>

              <a class="nav-link disabled" href="#">Disabled</a>
            </li>
          </ul>
          <form class="form-inline my-2 my-lg-0">
            <input class="form-control mr-sm-2" type="search" placeholder="Search" aria-label="Search">
            <button class="btn btn-outline-success my-2 my-sm-0" type="submit">Search</button>
          </form>
        </div>
      </nav>
    <div class="container">
    <h2>Form Validation</h2>
    <div class="alert alert-danger"   id="errdiv" >
        <button type="button" class="close" data-dismiss="alert" aria-label="Close" id="btnclose">
            <span aria-hidden="true">&times;</span>
          </button>
        <strong>Danger!</strong> 
        <p id="err"></p>
      </div>
    <form id="registration" novalidate>
        <div class="form-group">
            <label>Name</label>
            <input type="text" id="name" name="name" class="form-control" />
        </div>
        <div>
            <label>Contact</label>
            <input type="text" id="contact" name="contact"  class="form-control" />
        </div>
        <div>
            <label>Email</label>
            <input type="email" id="email" name="email" class="form-control"   />
        </div>
        <div>
            <label>Address </label>
            
            <textarea id="address" name="address"  cols="4" class="form-control" ></textarea>
        </div>
        <div>
            <button class="btn btn-success" >Submit</button>||
            <button class="btn btn-primary" >Clear</button>
        </div>
    </form>
</div>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script>
    $(document).ready(function(){
        $('.alert').alert('dispose')
$("#btnclose").click(function(){
    $(this).parent().hide()
})
        $("#errdiv").hide();
$("#registration").submit(function(event){
        event.preventDefault()
let errMsg="";
isValid=false;
console.log($("#name").val().trim().length)
        if($("#name").val().trim().length<=0){
        isValid=false;
        errMsg +="Please provide name </br>"
        }
       
        if($("#email").val().trim().length<=0){
        isValid=false;
        errMsg +="Please provide email </br>"
        }
        
        if($("#address").val().trim().length<=0){
        isValid=false;
        errMsg +="Please provide address </br>"
        }
         
        if($("#contact").val().trim().length<=0){
        isValid=false;
        errMsg +="Please provide contact </br>"
        }
        
        if(!isValid)
        {
                $("#err").html(errMsg)
                $("#errdiv").show();
        }
        else
        {

        }


})//form
    })
</script>
</body>
</html>
