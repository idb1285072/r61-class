<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #wrap {
            padding: 0;
            margin: 0 auto;
            width: 450px;
        }
    </style>
</head>
<body>
    <div id="wrap">
        <canvas id="canvas" width="450px" height="230px">
            Browser does not support canvas
        </canvas>
    </div>
    <script>
        var ctx = document
                .getElementById('canvas')
                .getContext('2d');
        
        if(ctx) {
            ctx.fillStyle = 'lightgray';
            ctx.fillRect(0, 0, 450, 230);
            let g1 = ctx.createRadialGradient(210, 100, 20, 220, 100, 130);
            g1.addColorStop(0, 'red');
            g1.addColorStop(.5, 'yellow');
            g1.addColorStop(1, 'blue');
            let g2 = ctx.createLinearGradient(125, 15, 325, 100);
            g2.addColorStop(0, 'violet');
            g2.addColorStop(.16, 'indigo');
            g2.addColorStop(.33, 'blue');
            g2.addColorStop(.50, 'green');
            g2.addColorStop(.66, 'yellow');
            g2.addColorStop(.85, 'orange');
            g2.addColorStop(1, 'red');
            ctx.fillStyle= g1;
            ctx.strokeStyle = g2;
            ctx.lineWidth = '20';
            ctx.arc(225, 115, 100, 0, 2*Math.PI);
            ctx.fill();
            ctx.stroke();
            
        }
    </script>
</body>
</html>
