<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="file" accept="image/*" id="pic"/>
    <br />
    <br />
    <img id="preview" src="images/nopic.webp" style="width: 200px;" />
    <script>
        document.getElementById("pic").addEventListener("change", function(){
            if(this.files.length) {
                let f = this.files[0];
                document.getElementById('preview').src= URL.createObjectURL(f);
            }
        })
    </script>
</body>
</html>
