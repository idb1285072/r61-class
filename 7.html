<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        box-sizing: border-box;
        padding: 0;
        margin: 0;
      }
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        font-family: 0.925rem;
      }
      .nav {
        display: flex;
        justify-content: space-between;
        padding: 0.5rem 0.5rem;
        background-color: #3f51b5;
      }
      .brand {
        display: block;
        width: 120px;
        color: white;
        font-weight: 700;
        font-size: 1rem;
      }
      .nav ul {
        list-style: none;
        display: flex;
      }
      .nav ul li {
        width: 90px;
      }
      .nav ul li a {
        display: block;
        text-align: center;
        text-decoration: none;
        color: white;
        padding: 0.5rem 0;
        border-radius: 0.25rem;
      }
      .nav ul li a:hover {
        background-color: #d32f2f;
      }
    </style>
  </head>
  <body>
    <nav class="nav">
      <span class="brand">Nav <sup>V1</sup></span>
      <ul>
        <li><a href="/">Home</a></li>
        <li><a href="#">Products</a></li>
        <li><a href="#">Service</a></li>
        <li><a href="#">About US</a></li>
      </ul>
    </nav>
    <main></main>
  </body>
</html>
