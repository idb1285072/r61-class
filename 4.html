<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #wrap {
            padding: 0;
            margin: 0 auto;
            width: 450px;
        }
    </style>
</head>
<body>
    <div id="wrap">
        <svg id="canvas" width="450px" height="230px">
            <defs>
               
                    <radialGradient id="g1" cx="50%" cy="50%" r="60%" fx="30%"
                    fy="30%">
                        <stop offset="0%" stop-color="red" />
                        <stop offset="50%" stop-color="yellow" />
                        <stop offset="100%" stop-color="blue" />
                    </radialGradient>
                    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0%" stop-color="violet" />
                        <stop offset="16%" stop-color="indigo" />
                        <stop offset="33%" stop-color="blue" />
                        <stop offset="50%" stop-color="green" />
                        <stop offset="66%" stop-color="yellow" />
                        <stop offset="84%" stop-color="orange" />
                        <stop offset="100%" stop-color="red" />
                    </linearGradient>
            </defs>  
            <rect x="0" y="0" width="450" height="230" fill="lightgray" />
            <circle cx="225" cy="115" r="100" fill="url(#g1)" stroke="url(#g2)" stroke-width="20" />
            Browser does not support canvas
        </svg>
    </div>
</body>
</html>
