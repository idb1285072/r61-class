<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #wrap {
            padding: 0;
            margin: 0 auto;
            width: 450px;
        }
    </style>
</head>
<body>
    <div id="wrap">
        <svg id="canvas" width="450px" height="230px">
            <rect x="0" y="0" width="450" height="230" fill="lightgray" />
            <circle cx="60" cy="60" r="50" fill="red" stroke="blue" stroke-width="7.5" />
            <ellipse cx="180" cy="60" rx="50" ry="50"  stroke="blue" stroke-width="7.5"/>
            <path d="M240 100 L340 100 L290 30z" fill="red" />            
            <line x1="240" y1="100" x2="340" y2="100" fill="red" stroke="blue" stroke-linecap="round" stroke-width="7.5"/>
            <line x1="340" y1="100" x2="290" y2="30"  stroke="blue" stroke-linecap="round" stroke-width="7.5"/>
            <line x1="290" y1="30" x2="240" y2="100"  stroke="blue" stroke-linejoin="round" stroke-width="7.5"/>
           
            Browser does not support canvas
        </svg>
    </div>
</body>
</html>
