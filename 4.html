<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lists</title>
    <style>
        body{
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
    </style>
</head>
<body>
    <h1>Un-ordered list</h1>
    <ul>
        <li>One</li>
        <li>Two</li>
        <li>Three</li>
    </ul>
    <ul type="circle">
        <li>One</li>
        <li>Two</li>
        <li>Three</li>
    </ul>
    <ul>
        <li>One
            <ul type="square">
                <li>1-1</li>
                <li>1-2</li>
            </ul>
        </li>
        <li>Two</li>
        <li>Three</li>
    </ul>
    <h1>Ordered list</h1>
    <ol>
        <li>One</li>
        <li>Two</li>
        <li>Three</li>
    </ol>
    <ol type="I">
        <li>One</li>
        <li>Two</li>
        <li>Three</li>
    </ol>
    <ol start="100">
        <li>One
            <ol type="I">
                <li>1-1</li>
                <li>1-2</li>
            </ol>
        </li>
        <li>Two</li>
        <li>Three</li>
    </ol>
</body>
</html>
